name: CI

# Five jobs: compile each head, run the unit tests, scan, and — only on a
# green main — cut a version.
#
#  * build    — compile the Android head and run the StyleCop / Meziantou /
#               Sonar analyzers. Rules escalated to "error" in .editorconfig
#               fail the build, so this is a real quality gate rather than a
#               compile check. Pull requests and dispatches only: on a push
#               to main the version job's release build is the analysis.
#  * ios      — the same for the iOS head, on macOS because nothing else can
#               build one, and archives an unsigned .ipa.
#  * test     — run the xUnit v3 suite over Link.Core (the MAUI-free half of
#               the app) with Coverlet coverage, upload to Coveralls, and then
#               run the Reqnroll specification over the same library. Ubuntu,
#               no workload: Link.Core, its tests and its specs are plain
#               net10.0, which is the entire reason that split exists — see
#               Link.Core's project file. The coverage figure covers the xUnit
#               suite only, deliberately; the specs are a gate, not a
#               contribution to the badge. A job of its own only when iOS
#               is built too; on an Android-only run - every push to main
#               and every unlabelled PR - the same steps run inside the
#               build job instead, from .github/actions/test-and-coverage.
#  * semgrep  — a job of its own rather than a step, because the other jobs
#               install a JDK and the MAUI workload and Semgrep needs neither.
#  * version  — main only. Builds the Android head once, in Release and
#               at the bumped version, which runs the same analyzers; runs
#               the tests; and only when both pass, pushes the version,
#               tags it and publishes the release with that build's APK.
#
# <b>Both heads are built, and both produce something installable-shaped.</b>
# This file used to say there was no iOS job because there was no iOS head;
# there is one now. What the iOS head does *not* have is push — no Firebase
# iOS SDK, no APNs key — so an iOS build polls, which is a documented working
# state rather than a broken one. The csproj says the same thing at more
# length.
#
# <b>Neither artifact is a shipping artifact, and both are easy to mistake for
# one.</b>
#
#  * The .ipa is unsigned. An installable one needs an Apple Developer
#    Program membership, a distribution certificate and a provisioning
#    profile, none of which exist. It is a compile gate and a re-signable
#    input, and it installs on nothing as it stands.
#  * The release's APK is signed with the runner's throwaway debug keystore, which is
#    generated fresh and is not the one on any developer machine. It will
#    therefore refuse to install over a locally built Link with
#    INSTALL_FAILED_UPDATE_INCOMPATIBLE, and getting past that means
#    uninstalling — which destroys the handset's private key and takes every
#    message ever sealed to it with it, permanently. Use a local build for a
#    handset that is already enrolled.
#
# Ported from Hand's ci.yml, deliberately: the two apps are maintained by the
# same people, share .editorconfig, stylecop.json and Directory.Build.props,
# and a second CI dialect would only mean two sets of habits. Two things
# Hand's workflow carries that are absent here, so nobody "restores parity":
#
#  * No UseDevCredentials flag. Hand embeds a devsettings.json for a
#    convenience sign-in path and CI has to switch it off so the shipping path
#    is what gets analysed. Link has no such path — appsettings.json is the
#    only configuration, and there is one of it.
#  * No Windows or MacCatalyst jobs. Hand has those heads; Link does not.
#
# CI builds without two git-ignored files, both guarded with
# Condition="Exists(...)" in the csproj:
#
#  * Platforms/Android/google-services.json — the build succeeds and produces
#    an app that polls rather than receiving pushes, which is a documented
#    degraded state rather than a broken build.
#  * Platforms/iOS/GoogleService-Info.plist — the same file for the other
#    head, and the iOS job now writes it from a secret when one is set. Not
#    because iOS is special on principle, but because the .ipa this workflow
#    archives is the artifact that actually reaches an iPhone, so a plist
#    absent here is push absent from every iOS install. The Android half is
#    still unwritten and still worth closing.
#  * appsettings.json — **written by the build now**, from the LINK_BASE_URL
#    repository variable, because an artifact somebody installs has to know
#    which intergroup it belongs to. Without the variable the behaviour is
#    the old one: the build succeeds and the sign-in screen says the app has
#    not been set up. The file still never enters git — it is where a
#    credential naturally gets typed, and Hand published a Better Stack token
#    exactly that way; .gitignore carries the full account.
#
# That second guard was missing when this repo was first pushed, and this job
# is what found it — CS1566, "Error reading resource appsettings.json". Worth
# recording, because the comment here claimed the guard existed before it did.
#
# The unconfigured artifact was found the same way: by installing one. It
# reached a real iPhone, opened, offered Google sign-in and then failed on
# every call, because nothing had ever needed CI's output to be a working
# app before.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    # `labeled` as well as the defaults, so putting the `ios` label on a PR
    # starts a run that builds the iOS head. Any other label starts a run
    # too; the concurrency group below cancels the one it supersedes.
    types: [ opened, synchronize, reopened, labeled ]
  # The iOS head is built only when asked for, from 2026-09-30: tick `ios`
  # on a dispatch, or label a PR `ios`. See the ios job.
  workflow_dispatch:
    inputs:
      ios:
        description: 'Also build and archive the iOS head'
        type: boolean
        default: false

# Pull request runs share one group per ref, so pushing again cancels the
# superseded run and saves runner minutes. Runs on main get a group of their
# own (run_id is unique) and so cancel nothing: the version job below lives
# in this workflow now, and a cancelled run would drop a version bump
# entirely. Same shape the PHP plugin suite uses.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Inventory — the logging Link shares with Register — comes from GitHub
  # Packages, which wants a token even for a public package.
  packages: read

# The token nuget.config expands at restore. PACKAGES_READ_TOKEN, a classic
# PAT with read:packages, if the repository has one; otherwise the workflow's
# own token, which can read a package only once that package has granted
# this repository access (package settings, "Manage Actions access").
# Register's CI does the same.
env:
  GITHUB_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build & analyze (net10.0-android)

    # Not on a push to main (2026-11-10). There the version job builds the
    # app once, in Release and at the bumped version, and that build runs
    # the same analyzers - so building it here first as well only doubled
    # the time from merge to release.
    if: github.event_name != 'push'

    # GitHub-hosted, unlike the iOS job below, and x64 on purpose.
    # Namespace was tried here on 2026-09-24 and the Android head cannot
    # build on it: that workspace's Linux profile is ARM64, and .NET's
    # Microsoft.Android.Sdk.Linux pack ships an x64-only aapt2, so the
    # build dies with "Exec format error" and XA0111 rather than anything
    # this file can fix. An AMD64 profile would work, but this repo is
    # public, ubuntu-latest is free, and the job takes three to four
    # minutes either way — the queue this change set out to kill was the
    # macOS one.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # JDK 21: what .NET 10's Android SDK builds against, and what the Android
      # SDK's API 36 tooling expects.
      - name: Setup JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # Single build with implicit restore. No narrowing flag is needed or
      # accepted: the csproj carries TargetFramework *singular*, net10.0-android,
      # because the iOS head is deliberately not listed until it works. An
      # earlier version of this step passed -p:LinkAndroidOnly=true, copied from
      # Hand — a property this project does not define, so it narrowed nothing
      # and the comment claiming it did was wrong.
      #
      # Still do NOT pass -f net10.0-android: that sets TargetFramework as a
      # global property, which would force the TFM onto Link.Core and break its
      # restore (NU1105). Nothing needs it here anyway.
      #
      # Debug config: no code signing (no keystore in the repo) and no release
      # trimming. Analyzer errors from .editorconfig break the build here.
      #
      # appsettings.json is git-ignored, so a checkout never has one, and
      # until now neither did any artifact CI produced. That was correct for
      # a build nobody installed and wrong the moment these artifacts became
      # something to put on a phone: the app came up with no idea which
      # intergroup it belonged to, and every call that needed a server URL
      # failed after sign-in rather than before it.
      #
      # Written from a repository *variable*, not a secret. The test bed's
      # address is public and appears in this repo's README; pretending
      # otherwise would buy nothing and make it harder to change. What the
      # variable buys is that the file still never enters git -- which is the
      # actual rule, because appsettings.json is where a credential naturally
      # gets typed and Hand published a Better Stack token exactly that way.
      #
      # Only BaseUrl is written. PollSeconds defaults to 120 in
      # FellowshipConfiguration.
      #
      # Unset is not a failure. A fork, or this repo before the variable
      # existed, builds exactly as it did before and produces an artifact
      # whose sign-in screen says the app has not been set up.
      - name: Write appsettings.json
        env:
          BASE_URL: ${{ vars.LINK_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL:-}" ]; then
            echo 'LINK_BASE_URL is not set; building unconfigured.'
            echo 'The artifact will run, and its sign-in screen will say so.'
            exit 0
          fi
          case "$BASE_URL" in
            https://*) ;;
            *) echo "LINK_BASE_URL must start with https:// -- got '$BASE_URL'" >&2; exit 1 ;;
          esac
          case "$BASE_URL" in
            *'"'*|*'\'*) echo 'LINK_BASE_URL must not contain quotes or backslashes.' >&2; exit 1 ;;
          esac
          printf '{\n  "Fellowship": {\n    "BaseUrl": "%s"\n  }\n}\n' "$BASE_URL" \
            > TheBleedingDeacons.Intergroup.Link/appsettings.json
          echo 'Wrote:'
          cat TheBleedingDeacons.Intergroup.Link/appsettings.json

      #
      # LinkAndroidOnly narrows TargetFrameworks to the Android head. On a
      # Linux runner the csproj already resolves to Android alone — only
      # macOS gets both — so this is belt and braces rather than load-bearing,
      # and it documents the intent at the call site. It is also a property
      # that now exists: an earlier version of this step passed it when
      # nothing defined it, so it narrowed nothing and the comment claiming
      # otherwise was wrong.
      - name: Build & analyze
        run: >
          dotnet build TheBleedingDeacons.Intergroup.Link/TheBleedingDeacons.Intergroup.Link.csproj
          -c Debug
          -p:LinkAndroidOnly=true
          -p:ContinuousIntegrationBuild=true

      # No APK is built or uploaded here any more (2026-11-09): the Release
      # build and its upload roughly doubled this job, and nobody installed
      # the three-day link-apk artifact - a handset gets a local build or
      # Play's. The release job below still builds the APK it attaches.

      # The tests, here rather than in a job of their own whenever Android
      # is the only head being built - which is every push to main and every
      # PR without the `ios` label (2026-11-09). A separate job paid for its
      # own runner, checkout and .NET setup to do two minutes of work; this
      # job already has all three. When iOS is built as well, the test job
      # below runs them instead, so they still run once and only once. The
      # condition is the ios job's own `if`, negated - keep the two in step.
      - name: Test & coverage
        if: >-
          ${{ !((github.event_name == 'workflow_dispatch' && inputs.ios)
          || contains(github.event.pull_request.labels.*.name, 'ios')) }}
        uses: ./.github/actions/test-and-coverage
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  ios:
    name: Build & archive (net10.0-ios)

    # Built only when asked for, from 2026-09-30, by request: a dispatch with
    # `ios` ticked, or an `ios` label on a pull request.
    #
    #   gh workflow run ci.yml -R bleedingdeacons/link --ref <branch> -f ios=true
    #   gh pr edit <n> -R bleedingdeacons/link --add-label ios
    #
    # This is the second time. It was opt-in from 2026-09-11 to 2026-09-24
    # too, and went back to every run because iOS breakage then surfaced in
    # batches rather than on the commit that caused it — which is exactly
    # what happened next: a workload update made every iOS build fail on
    # 2026-09-30, and it surfaced only because this job ran. That is the
    # trade being made again, knowingly. It never runs on a push to main,
    # so it never holds up a release.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.ios)
      || contains(github.event.pull_request.labels.*.name, 'ios')
    #
    # macOS is not a preference here: the iOS toolchain will not run
    # anywhere else. Which macOS is a repository variable, because the two
    # options trade against each other and the answer changes:
    #
    #  * unset (the default) — GitHub's own macos-26. Free on a public
    #    repository, and around eleven minutes once a runner picks it up,
    #    which is itself an unbounded wait.
    #  * IOS_RUNNER set to `namespace-profile-link-macos` — a Namespace
    #    macOS runner, about four minutes end to end, and billed. That is
    #    why it is not the default: this is the only job here that costs
    #    anything, and it runs on every push and PR.
    #
    # Flipping between them is a variable, not a pull request:
    #   gh variable set IOS_RUNNER -R bleedingdeacons/link     #     -b namespace-profile-link-macos      # fast, paid
    #   gh variable delete IOS_RUNNER -R bleedingdeacons/link  # free, slow
    #
    # A `runs-on` expression sees no secrets and only `vars`, so the label
    # has to be a variable rather than a secret. A typo'd value is a job
    # that sits `queued` until GitHub's 24-hour timeout rather than one
    # that fails — check `runs-on` in the log if a build never starts.
    #
    # On Namespace the image carried Xcode 26.4.1, not the 26.6 this file
    # used to insist on, and the .NET for iOS SDK accepted it (proven
    # 2026-09-24, a green .ipa). The Select Xcode step below falls back to
    # the newest installed on whichever image it lands, and
    # `xcodebuild -version` in the log says which it got.
    runs-on: ${{ vars.IOS_RUNNER || 'macos-26' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Pinned rather than left to the image default, which is 26.6 today
      # and is not promised to stay there. The .NET for iOS SDK refuses an
      # Xcode older than it expects, so the day the image moves this job
      # either keeps working or says exactly which version it wanted --
      # `xcodebuild -version` in the log is what makes that readable.
      #
      # Falls back to the newest installed Xcode rather than failing, so an
      # image that has moved on gets one honest attempt before the .NET SDK
      # gives its own verdict.
      - name: Select Xcode
        run: |
          set -euo pipefail
          wanted=/Applications/Xcode_26.6.app
          if [ ! -d "$wanted" ]; then
            echo "Xcode 26.6 is not on this image; falling back to the newest installed."
            ls -d /Applications/Xcode*.app || true
            wanted=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          fi
          echo "Selecting $wanted"
          sudo xcode-select -s "$wanted"
          xcodebuild -version

      # maui-ios, not maui: the full workload would pull in the Android SDK
      # and MacCatalyst for a job that builds neither.
      # Pinned to a workload set, not left to take the newest. On 2026-09-30
      # the newest set for this SDK band, 10.0.401.1, moved the iOS SDK to
      # 27.0, which refuses to build with anything older than Xcode 27 --
      # and the image's newest Xcode is 26.6. Every iOS build, main's
      # included, failed on "requires Xcode 27.0", and with the iOS head a
      # gate on the version job, nothing released. 10.0.401 carries iOS
      # 26.5.10318, which builds with 26.6.
      #
      # Move the pin when the image has Xcode 27:
      #   dotnet workload search version <set>   # lists each set's iOS SDK
      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios --version 10.0.401

      # appsettings.json is git-ignored, so a checkout never has one, and
      # until now neither did any artifact CI produced. That was correct for
      # a build nobody installed and wrong the moment these artifacts became
      # something to put on a phone: the app came up with no idea which
      # intergroup it belonged to, and every call that needed a server URL
      # failed after sign-in rather than before it.
      #
      # Written from a repository *variable*, not a secret. The test bed's
      # address is public and appears in this repo's README; pretending
      # otherwise would buy nothing and make it harder to change. What the
      # variable buys is that the file still never enters git -- which is the
      # actual rule, because appsettings.json is where a credential naturally
      # gets typed and Hand published a Better Stack token exactly that way.
      #
      # Only BaseUrl is written. PollSeconds defaults to 120 in
      # FellowshipConfiguration.
      #
      # Unset is not a failure. A fork, or this repo before the variable
      # existed, builds exactly as it did before and produces an artifact
      # whose sign-in screen says the app has not been set up.
      - name: Write appsettings.json
        env:
          BASE_URL: ${{ vars.LINK_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL:-}" ]; then
            echo 'LINK_BASE_URL is not set; building unconfigured.'
            echo 'The artifact will run, and its sign-in screen will say so.'
            exit 0
          fi
          case "$BASE_URL" in
            https://*) ;;
            *) echo "LINK_BASE_URL must start with https:// -- got '$BASE_URL'" >&2; exit 1 ;;
          esac
          case "$BASE_URL" in
            *'"'*|*'\'*) echo 'LINK_BASE_URL must not contain quotes or backslashes.' >&2; exit 1 ;;
          esac
          printf '{\n  "Fellowship": {\n    "BaseUrl": "%s"\n  }\n}\n' "$BASE_URL" \
            > TheBleedingDeacons.Intergroup.Link/appsettings.json
          echo 'Wrote:'
          cat TheBleedingDeacons.Intergroup.Link/appsettings.json

      # Without this the .ipa builds and polls, silently — and the .ipa this
      # job archives is the one Sideloadly puts on the iPhone, so that is the
      # only iOS build there is. See the script for why the Android job has
      # no matching step yet.
      - name: Write GoogleService-Info.plist
        env:
          GOOGLE_SERVICES_PLIST: ${{ secrets.GOOGLE_SERVICES_PLIST }}
        run: bash .github/scripts/write-google-services-plist.sh

      # Release for a device (ios-arm64), unsigned.
      #
      # LinkIosOnly narrows TargetFrameworks to the iOS head. Do NOT reach
      # for -f net10.0-ios instead: that sets TargetFramework as a global
      # property and forces it onto Link.Core, which is plain net10.0, and
      # its restore fails with NU1105.
      #
      # LinkUnsigned switches off code signing in the csproj. The device RID
      # rather than a simulator one is deliberate — a simulator build needs
      # no signing at all and would be an easier green, but it produces a
      # .app for an architecture no phone runs, and calling that an iOS
      # artifact would be a lie the badge could not tell apart.
      - name: Build the iOS head, unsigned
        run: >
          dotnet build TheBleedingDeacons.Intergroup.Link/TheBleedingDeacons.Intergroup.Link.csproj
          -c Release
          -p:LinkIosOnly=true
          -p:LinkUnsigned=true
          -p:RuntimeIdentifier=ios-arm64
          -p:ContinuousIntegrationBuild=true

      # An .ipa is a zip with the .app inside a Payload/ directory, and that
      # is the whole format. Assembled by hand rather than with
      # ArchiveOnBuild=true, which drives Xcode's archive step and wants a
      # signing identity — the one thing this job does not have.
      #
      # -y keeps symlinks as symlinks. A framework bundle is full of them,
      # and following them produces an archive that is larger and, on iOS,
      # wrong.
      - name: Assemble the .ipa
        run: |
          set -euo pipefail
          app=$(find TheBleedingDeacons.Intergroup.Link/bin/Release/net10.0-ios                 -maxdepth 3 -type d -name '*.app' | head -1)
          if [ -z "$app" ]; then
            echo 'No .app was produced; nothing to archive.' >&2
            exit 1
          fi
          echo "Archiving $app"
          mkdir -p archive/Payload
          cp -R "$app" archive/Payload/
          (cd archive && zip -qry ../link-unsigned.ipa Payload)
          ls -la link-unsigned.ipa

      - name: Upload the .ipa
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: link-ipa-unsigned
          path: link-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  ios-test-release:
    name: Publish the .ipa to the ios-test release

    # Every run that builds the iOS head also puts its .ipa on one standing
    # GitHub release, `ios-test`, replacing the file that was there. So the
    # newest unsigned .ipa always lives at one fixed address, rather than as
    # an artifact on whichever run last built it, which expires after 30
    # days and has to be looked up by run id.
    #
    # A test release, and marked as one: a prerelease and never Latest, so it
    # cannot be mistaken for a version. The release job's tags are v1.2.3 and
    # bump-version.sh only reads tags matching v[0-9]*, so `ios-test` is
    # invisible to it.
    #
    # Its own job, on ubuntu, rather than more steps in `ios`. That job runs
    # a pull request's code on macOS with a read-only token. This one runs
    # nothing from the checkout, and is the only place `contents: write` is
    # granted for it.
    #
    # Pull-request runs publish too: the point is the newest build to
    # sideload, merged or not. The notes say which commit and which run, so
    # a PR build is never taken for main. Now that iOS builds on every PR,
    # that means every PR moves it — check the notes before sideloading.
    #
    # Except Dependabot's and forks'. Both get a read-only token whatever
    # `permissions:` asks for, so the upload would fail and turn a dependency
    # bump red for a release it was never meant to touch. While the head was
    # opt-in nobody labelled those, so the question never came up.
    needs: ios
    if: >-
      ${{ needs.ios.result == 'success'
      && (github.event_name != 'pull_request'
          || (github.event.pull_request.head.repo.full_name == github.repository
              && github.actor != 'dependabot[bot]')) }}

    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: read

    # One at a time, and none cancelled. Overwriting is the design, so the
    # only question is order, and a queue keeps two runs from interleaving
    # the tag move, the notes and the upload.
    concurrency:
      group: ios-test-release
      cancel-in-progress: false

    steps:
      - name: Publish link-unsigned.ipa to ios-test
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/ios-test
          # The branch commit for a pull request, not the synthetic merge
          # commit, so the tag points at something that stays in history.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # Quoted, and no '#' inside. Unquoted, YAML read ' #{0}' as the
          # start of a comment, cut the expression off before its closing
          # braces, and GitHub rejected the whole workflow: every job on
          # main and on pull requests stopped running, with nothing but
          # "a workflow file issue" to say why. A YAML parser accepts the
          # truncated line without complaint, which is how it merged.
          REF_LABEL: "${{ github.event.pull_request.number && format('pull request {0}', github.event.pull_request.number) || github.ref_name }}"
        run: |
          set -euo pipefail
          tag=ios-test

          gh run download "$RUN_ID" -n link-ipa-unsigned -D ipa
          test -f ipa/link-unsigned.ipa
          ls -la ipa/link-unsigned.ipa

          notes=$(printf '%s\n' \
            'The newest unsigned Link .ipa, replaced by every CI run that builds the iOS head.' \
            '' \
            "Built from ${REF_LABEL} at ${SHA}, $(date -u '+%Y-%m-%d %H:%M UTC')." \
            "Run: ${RUN_URL}" \
            '' \
            'Unsigned: it installs on nothing until it is re-signed. Sideloadly (or /sideload) does that on the way onto an iPhone.')

          if gh release view "$tag" >/dev/null 2>&1; then
            # Move the tag to the commit this .ipa was built from, so the
            # release page and the file agree about what they are.
            gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/${tag}" -f sha="$SHA" -F force=true >/dev/null
            gh release edit "$tag" --prerelease --latest=false --title 'Link iOS test build' --notes "$notes"
          else
            gh release create "$tag" --target "$SHA" --prerelease --latest=false \
              --title 'Link iOS test build' --notes "$notes"
          fi

          gh release upload "$tag" ipa/link-unsigned.ipa --clobber
          echo "Published: ${RELEASE_URL}"

  test:
    name: Test & coverage
    runs-on: ubuntu-latest

    # Only when iOS is built too. On an Android-only run the build job runs
    # these same steps itself (see its Test & coverage step); on a push to
    # main the version job does. The condition is the ios job's own `if` -
    # keep the two in step.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.ios)
      || contains(github.event.pull_request.labels.*.name, 'ios')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Test & coverage
        uses: ./.github/actions/test-and-coverage
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest

    # A job of its own, rather than a step inside the build as the PHP plugins
    # do it. There the scan is a step because it has to fail before
    # `composer install`; here the surrounding jobs install a JDK, the .NET SDK
    # and the MAUI Android workload, none of which Semgrep needs. A
    # separate job runs in parallel and reports on its own terms.
    #
    # `semgrep ci` is diff-aware on a pull request, so it fails only on what
    # that PR introduces. Which findings are fatal is decided by the Block
    # remediation policy in Semgrep - currently Critical or High severity Code
    # findings - not by anything in this file.
    #
    # The version job below has this job in its `needs:`, so a red Semgrep on
    # main stops a version being cut, the same way `release: needs: ci` works
    # in the PHP plugin suite.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Semgrep
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          if [ -z "${SEMGREP_APP_TOKEN:-}" ]; then
            echo 'SEMGREP_APP_TOKEN is not set - skipping the scan.'
            echo 'Set it as an organisation secret to enable this gate.'
            exit 0
          fi
          python3 -m pip install --quiet semgrep==1.174.0
          semgrep ci

  version:
    name: Bump version & publish the release
    # The release, and on main the gate as well. Until 2026-11-10 the build
    # job compiled and analysed the app in Debug, then this job built it all
    # over again in Release for the APK. Now this job is the only build on a
    # push to main: Release, after the bump, with the analyzers running as
    # part of it, followed by the tests. Nothing is pushed, tagged or
    # published until both have passed, so a version is still something only
    # green code gets.
    #
    # Semgrep stays a job of its own and is waited for. The build, test and
    # ios jobs never run on a push to main, so there is nothing to wait for
    # from them.
    needs: [semgrep]

    # main only, and only for a real push - not for pull_request runs of this
    # same workflow, and not for workflow_dispatch.
    if: >-
      ${{ !cancelled()
      && github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && needs.semgrep.result == 'success' }}

    runs-on: ubuntu-latest

    # The workflow default is contents: read; pushing the version commit needs
    # write, asked for here so nothing else in this file gets it. packages:
    # read because a job's permissions replace the workflow's rather than add
    # to them, and this job restores Inventory.
    permissions:
      contents: write
      packages: read

    # Serialise. Two merges landing close together must not race to compute the
    # same next version. Deliberately not cancel-in-progress: a cancelled run
    # would drop a bump entirely.
    concurrency:
      group: version-main
      cancel-in-progress: false

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the bump is derived by walking the commits this push
          # brought in.
          fetch-depth: 0

      - name: Compute and apply the bump
        id: bump
        # Invoked through bash rather than directly: this repo is authored on
        # Windows, where git frequently does not record the executable bit, and
        # a missing +x would fail the run for a reason nothing in the diff shows.
        #
        # github.event.before is the tip main had before this push. It is
        # all-zeros on a branch's first push, and can point at a commit this
        # clone does not have after a force-push, so fall back to HEAD~1.
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            echo "No usable github.event.before; falling back to HEAD~1."
            before="HEAD~1"
          fi
          bash .github/scripts/bump-version.sh "${before}..HEAD"

      # ---------------------------------------------------------------
      # Build once, at the version being released.
      #
      # After the bump, so the APK's manifest carries the version it is
      # released as - an APK built before it would disagree with its own
      # tag. Release rather than Debug: Debug means Fast Deployment, which
      # leaves the managed assemblies out of the APK. The analyzers are not
      # tied to a configuration, so this build is the analysis too, and an
      # .editorconfig error stops the release here.
      #
      # Every step up to the tests runs whether or not there is a version:
      # on main this job is the only build, so it is the gate even for a
      # push with nothing to release.
      - name: Setup JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # Same file, same rules, and the same silence when unset as the build
      # job — see the long comment there for why this is a variable and not a
      # secret. Repeated rather than shared: a composite action for four
      # lines would hide the one thing worth reading.
      - name: Write appsettings.json
        env:
          BASE_URL: ${{ vars.LINK_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL:-}" ]; then
            echo 'LINK_BASE_URL is not set; releasing an unconfigured build.'
            echo 'It will run, and its sign-in screen will say it is not set up.'
            exit 0
          fi
          case "$BASE_URL" in
            https://*) ;;
            *) echo "LINK_BASE_URL must start with https:// -- got '$BASE_URL'" >&2; exit 1 ;;
          esac
          case "$BASE_URL" in
            *'"'*|*'\'*) echo 'LINK_BASE_URL must not contain quotes or backslashes.' >&2; exit 1 ;;
          esac
          printf '{\n  "Fellowship": {\n    "BaseUrl": "%s"\n  }\n}\n' "$BASE_URL" \
            > TheBleedingDeacons.Intergroup.Link/appsettings.json

      - name: Build & analyze the release APK
        run: >
          dotnet build TheBleedingDeacons.Intergroup.Link/TheBleedingDeacons.Intergroup.Link.csproj
          -c Release
          -p:LinkAndroidOnly=true
          -p:ContinuousIntegrationBuild=true

      - name: Test & coverage
        uses: ./.github/actions/test-and-coverage
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------------
      # Only now, with the build and the tests green, does anything leave
      # the runner.
      - name: Commit the new version
        id: commit
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # [skip ci] so this push does not re-run the build jobs against a
          # commit whose only change is a version string. The script also
          # refuses to bump when HEAD is already a version commit, so the loop
          # is closed twice over — belt and braces, because a runaway here
          # would bump on every iteration.
          git commit -am "chore: version ${{ steps.bump.outputs.version }} [skip ci]"

          # Rebase onto anything that landed while this job was running, and
          # retry. A bare `git push` here fails outright when main has moved
          # between the checkout above and this line, and that is not
          # hypothetical: it happened on 2026-09-05, when a merge landed
          # sixteen seconds before this push and took the whole release with
          # it. Every gate had passed; the version was simply lost, and the
          # next release skipped a number to catch up.
          #
          # The concurrency group above serialises this job against *itself*,
          # so the race is never two version jobs — it is a person merging
          # while one is in flight, which no amount of job-level concurrency
          # can prevent.
          #
          # Rebasing is safe for the version this job computed. The bump was
          # derived from the commit range this run was triggered for, and the
          # commits that arrived meanwhile are not in that range — they get
          # their own run and their own bump, so nothing is skipped or
          # double-counted by landing this commit on top of them.
          #
          # A conflict is not retried. The only way to conflict here is
          # another writer touching the same version line, which the
          # concurrency group already rules out for this job — so it means
          # something genuinely unexpected, and failing loudly beats
          # resolving it blind.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed the version commit on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt; main moved. Rebasing onto it."
            if ! git pull --rebase origin main; then
              echo "Rebase onto main failed; leaving it alone." >&2
              git rebase --abort || true
              exit 1
            fi
            # Main moved, so HEAD is no longer the tree built and tested
            # above. Say so, and the steps below build and test it again
            # before anything is tagged or published.
            echo "rebased=true" >> "$GITHUB_OUTPUT"
          done
          echo "Could not push the version commit after 3 attempts." >&2
          exit 1

      # Only when the push above had to rebase. The build and the tests
      # earlier in this job ran on the tree as it was before main moved;
      # the tag goes on HEAD, which now carries whatever landed meanwhile.
      # Without this, the release's APK would be older code than the tag it
      # is attached to (caught in review on #109). Rare - it needs a merge
      # during the few minutes this job runs - so it costs nothing usually.
      - name: Rebuild after main moved
        if: steps.commit.outputs.rebased == 'true'
        run: >
          dotnet build TheBleedingDeacons.Intergroup.Link/TheBleedingDeacons.Intergroup.Link.csproj
          -c Release
          -p:LinkAndroidOnly=true
          -p:ContinuousIntegrationBuild=true

      - name: Retest after main moved
        if: steps.commit.outputs.rebased == 'true'
        uses: ./.github/actions/test-and-coverage
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The tag is not decoration: it is how bump-version.sh knows whether
      # anything has shipped, which is what lets the first release keep the
      # version in the csproj instead of bumping past it. Written after the
      # commit so it points at the version it names.
      #
      # Guarded against existing, so a re-run of a green release is a no-op
      # rather than a failure.
      - name: Tag the release
        if: steps.bump.outputs.version != ''
        run: |
          tag="v${{ steps.bump.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to tag."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"

      # ---------------------------------------------------------------
      # Publish a GitHub Release, with the APK built above. A workflow
      # artifact expires after 30 days; a release does not, so every version
      # keeps something downloadable. Android only: the .ipa is built on
      # macOS, and it is unsigned, so it installs on nothing until somebody
      # re-signs it.
      #
      # -Signed.apk is the one to keep: .NET Android emits an unsigned
      # intermediate alongside it. Renamed for the version so a downloaded
      # file still says what it is once it is sitting in somebody's downloads
      # folder next to four others.
      - name: Name the APK for its version
        id: apk
        if: steps.bump.outputs.version != ''
        run: |
          set -euo pipefail
          src=$(ls TheBleedingDeacons.Intergroup.Link/bin/Release/net10.0-android/*-Signed.apk 2>/dev/null | head -1)
          if [ -z "$src" ]; then
            echo 'No -Signed.apk was produced. bin/Release/net10.0-android holds:' >&2
            ls -l TheBleedingDeacons.Intergroup.Link/bin/Release/net10.0-android || true
            exit 1
          fi
          out="link-${{ steps.bump.outputs.version }}.apk"
          cp "$src" "$out"
          echo "apk=$out" >> "$GITHUB_OUTPUT"
          ls -l "$out"

      # The body is not decoration. This APK is signed with the runner's
      # throwaway debug keystore, and somebody will eventually find this page
      # without having read a line of ci.yml — at which point the difference
      # between "a build you can try" and "a build that costs you every
      # message on that handset" needs to be on the page they are looking at.
      - name: Write the release notes
        if: steps.bump.outputs.version != ''
        run: |
          cat > release-notes.md <<'EOF'
          ### What this APK is

          A **Debug-keystore-signed** Android build, produced on a GitHub runner
          from the commit this tag names. It is a compile gate and a
          convenience — not a shipping artifact.

          ### Before you install it

          It is signed with the runner's own throwaway key, which is not the key
          on any developer machine. If you already have a locally built Link on
          the handset, it will refuse to install over it with
          `INSTALL_FAILED_UPDATE_INCOMPATIBLE`.

          **Do not uninstall to get past that.** Link's device token and its RSA
          private key live in `SecureStorage`, and Fellowship holds only the
          public half — so uninstalling makes every message already sealed to
          that handset permanently unreadable, by everyone, with no way back.
          The encrypted local history goes with it. Build locally instead.

          ### iOS

          Not attached. The `.ipa` this workflow archives is unsigned and
          installs on nothing until it is re-signed with an Apple Developer
          Program certificate.
          EOF

      # Guarded against existing so a re-run of a green release is a no-op
      # rather than a failure, matching the tag step above.
      - name: Publish the GitHub Release
        if: steps.bump.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v${{ steps.bump.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released; nothing to publish."
            exit 0
          fi
          gh release create "$tag" \
            "${{ steps.apk.outputs.apk }}" \
            --title "$tag" \
            --notes-file release-notes.md \
            --generate-notes

      - name: Summary
        run: |
          if [ "${{ steps.bump.outputs.first }}" = "true" ]; then
            echo "### Version ${{ steps.bump.outputs.version }} (first release)" >> "$GITHUB_STEP_SUMMARY"
            echo "Adopted from the csproj rather than bumped; tagged v${{ steps.bump.outputs.version }}." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.bump.outputs.changed }}" = "true" ]; then
            echo "### Version ${{ steps.bump.outputs.version }} (${{ steps.bump.outputs.bump }} bump)" >> "$GITHUB_STEP_SUMMARY"
            echo "Android versionCode ${{ steps.bump.outputs.code }}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Version unchanged" >> "$GITHUB_STEP_SUMMARY"
            echo "Nothing to version in this push." >> "$GITHUB_STEP_SUMMARY"
          fi
