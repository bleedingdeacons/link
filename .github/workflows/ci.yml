name: CI

# Five jobs: compile each head, run the unit tests, scan, and — only on a
# green main — cut a version.
#
#  * build    — compile the Android head and run the StyleCop / Meziantou /
#               Sonar analyzers. Rules escalated to "error" in .editorconfig
#               fail the build, so this is a real quality gate rather than a
#               compile check. Then builds a Release APK and uploads it.
#  * ios      — the same for the iOS head, on macOS because nothing else can
#               build one, and archives an unsigned .ipa.
#  * test     — run the xUnit v3 suite over Link.Core (the MAUI-free half of
#               the app) with Coverlet coverage, and upload to Coveralls.
#               Ubuntu, no workload: Link.Core and its tests are plain
#               net10.0, which is the entire reason that split exists — see
#               Link.Core's project file.
#  * semgrep  — a job of its own rather than a step, because the other jobs
#               install a JDK and the MAUI workload and Semgrep needs neither.
#  * version  — bumps the version, and only after all three have passed.
#
# <b>Both heads are built, and both produce something installable-shaped.</b>
# This file used to say there was no iOS job because there was no iOS head;
# there is one now. What the iOS head does *not* have is push — no Firebase
# iOS SDK, no APNs key — so an iOS build polls, which is a documented working
# state rather than a broken one. The csproj says the same thing at more
# length.
#
# <b>Neither artifact is a shipping artifact, and both are easy to mistake for
# one.</b>
#
#  * The .ipa is unsigned. An installable one needs an Apple Developer
#    Program membership, a distribution certificate and a provisioning
#    profile, none of which exist. It is a compile gate and a re-signable
#    input, and it installs on nothing as it stands.
#  * The APK is signed with the runner's throwaway debug keystore, which is
#    generated fresh and is not the one on any developer machine. It will
#    therefore refuse to install over a locally built Link with
#    INSTALL_FAILED_UPDATE_INCOMPATIBLE, and getting past that means
#    uninstalling — which destroys the handset's private key and takes every
#    message ever sealed to it with it, permanently. Use a local build for a
#    handset that is already enrolled.
#
# Ported from Hand's ci.yml, deliberately: the two apps are maintained by the
# same people, share .editorconfig, stylecop.json and Directory.Build.props,
# and a second CI dialect would only mean two sets of habits. Two things
# Hand's workflow carries that are absent here, so nobody "restores parity":
#
#  * No UseDevCredentials flag. Hand embeds a devsettings.json for a
#    convenience sign-in path and CI has to switch it off so the shipping path
#    is what gets analysed. Link has no such path — appsettings.json is the
#    only configuration, and there is one of it.
#  * No Windows or MacCatalyst jobs. Hand has those heads; Link does not.
#
# CI builds without two git-ignored files, both guarded with
# Condition="Exists(...)" in the csproj:
#
#  * Platforms/Android/google-services.json — the build succeeds and produces
#    an app that polls rather than receiving pushes, which is a documented
#    degraded state rather than a broken build.
#  * appsettings.json — **written by the build now**, from the LINK_BASE_URL
#    repository variable, because an artifact somebody installs has to know
#    which intergroup it belongs to. Without the variable the behaviour is
#    the old one: the build succeeds and the sign-in screen says the app has
#    not been set up. The file still never enters git — it is where a
#    credential naturally gets typed, and Hand published a Better Stack token
#    exactly that way; .gitignore carries the full account.
#
# That second guard was missing when this repo was first pushed, and this job
# is what found it — CS1566, "Error reading resource appsettings.json". Worth
# recording, because the comment here claimed the guard existed before it did.
#
# The unconfigured artifact was found the same way: by installing one. It
# reached a real iPhone, opened, offered Google sign-in and then failed on
# every call, because nothing had ever needed CI's output to be a working
# app before.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Pull request runs share one group per ref, so pushing again cancels the
# superseded run and saves runner minutes. Runs on main get a group of their
# own (run_id is unique) and so cancel nothing: the version job below lives
# in this workflow now, and a cancelled run would drop a version bump
# entirely. Same shape the PHP plugin suite uses.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build & analyze (net10.0-android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # JDK 21: what .NET 10's Android SDK builds against, and what the Android
      # SDK's API 36 tooling expects.
      - name: Setup JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # Single build with implicit restore. No narrowing flag is needed or
      # accepted: the csproj carries TargetFramework *singular*, net10.0-android,
      # because the iOS head is deliberately not listed until it works. An
      # earlier version of this step passed -p:LinkAndroidOnly=true, copied from
      # Hand — a property this project does not define, so it narrowed nothing
      # and the comment claiming it did was wrong.
      #
      # Still do NOT pass -f net10.0-android: that sets TargetFramework as a
      # global property, which would force the TFM onto Link.Core and break its
      # restore (NU1105). Nothing needs it here anyway.
      #
      # Debug config: no code signing (no keystore in the repo) and no release
      # trimming. Analyzer errors from .editorconfig break the build here.
      #
      # appsettings.json is git-ignored, so a checkout never has one, and
      # until now neither did any artifact CI produced. That was correct for
      # a build nobody installed and wrong the moment these artifacts became
      # something to put on a phone: the app came up with no idea which
      # intergroup it belonged to, and every call that needed a server URL
      # failed after sign-in rather than before it.
      #
      # Written from a repository *variable*, not a secret. The test bed's
      # address is public and appears in this repo's README; pretending
      # otherwise would buy nothing and make it harder to change. What the
      # variable buys is that the file still never enters git -- which is the
      # actual rule, because appsettings.json is where a credential naturally
      # gets typed and Hand published a Better Stack token exactly that way.
      #
      # Only BaseUrl is written. CallbackUrl defaults to link://auth in
      # FellowshipConfiguration and PollSeconds to 120, so naming them here
      # would add a fifth place for the callback scheme to disagree with
      # itself -- see README.md, "The four places link://auth is written".
      #
      # Unset is not a failure. A fork, or this repo before the variable
      # existed, builds exactly as it did before and produces an artifact
      # whose sign-in screen says the app has not been set up.
      - name: Write appsettings.json
        env:
          BASE_URL: ${{ vars.LINK_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL:-}" ]; then
            echo 'LINK_BASE_URL is not set; building unconfigured.'
            echo 'The artifact will run, and its sign-in screen will say so.'
            exit 0
          fi
          case "$BASE_URL" in
            https://*) ;;
            *) echo "LINK_BASE_URL must start with https:// -- got '$BASE_URL'" >&2; exit 1 ;;
          esac
          case "$BASE_URL" in
            *'"'*|*'\'*) echo 'LINK_BASE_URL must not contain quotes or backslashes.' >&2; exit 1 ;;
          esac
          printf '{\n  "Fellowship": {\n    "BaseUrl": "%s"\n  }\n}\n' "$BASE_URL" \
            > TheBleedingDeacons.Intergroup.Link/appsettings.json
          echo 'Wrote:'
          cat TheBleedingDeacons.Intergroup.Link/appsettings.json

      #
      # LinkAndroidOnly narrows TargetFrameworks to the Android head. On a
      # Linux runner the csproj already resolves to Android alone — only
      # macOS gets both — so this is belt and braces rather than load-bearing,
      # and it documents the intent at the call site. It is also a property
      # that now exists: an earlier version of this step passed it when
      # nothing defined it, so it narrowed nothing and the comment claiming
      # otherwise was wrong.
      - name: Build & analyze
        run: >
          dotnet build TheBleedingDeacons.Intergroup.Link/TheBleedingDeacons.Intergroup.Link.csproj
          -c Debug
          -p:LinkAndroidOnly=true
          -p:ContinuousIntegrationBuild=true

      # A separate Release build rather than uploading the Debug output.
      # Debug means Fast Deployment, which leaves the managed assemblies out
      # of the APK unless EmbedAssembliesIntoApk is forced — an artifact that
      # installs, launches and immediately aborts. Release embeds them by
      # default and strips to one ABI (see the csproj), so it is both correct
      # and a third the size.
      - name: Build the APK
        run: >
          dotnet build TheBleedingDeacons.Intergroup.Link/TheBleedingDeacons.Intergroup.Link.csproj
          -c Release
          -p:LinkAndroidOnly=true
          -p:ContinuousIntegrationBuild=true

      # -Signed.apk is the one to keep: .NET Android emits an unsigned
      # intermediate alongside it, and uploading both would leave whoever
      # downloads them to guess.
      - name: Upload the APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: link-apk
          path: TheBleedingDeacons.Intergroup.Link/bin/Release/net10.0-android/*-Signed.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    name: Build & archive (net10.0-ios)

    # macOS is not a preference here: the iOS toolchain will not run anywhere
    # else. Public repository, so GitHub-hosted macOS minutes are free; on a
    # private one this job would be the expensive part of the workflow.
    #
    # macos-26, not macos-15. The .NET for iOS SDK pins the Xcode it will
    # build against and refuses anything older -- 26.5.10315 wants Xcode 26.6,
    # and the macos-15 image tops out at 16.4, which fails at the first
    # target with a clear message and no build. macos-26 ships 26.6 as its
    # default.
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Pinned rather than left to the image default, which is 26.6 today
      # and is not promised to stay there. The .NET for iOS SDK refuses an
      # Xcode older than it expects, so the day the image moves this job
      # either keeps working or says exactly which version it wanted --
      # `xcodebuild -version` in the log is what makes that readable.
      #
      # Falls back to the newest installed Xcode rather than failing, so an
      # image that has moved on gets one honest attempt before the .NET SDK
      # gives its own verdict.
      - name: Select Xcode
        run: |
          set -euo pipefail
          wanted=/Applications/Xcode_26.6.app
          if [ ! -d "$wanted" ]; then
            echo "Xcode 26.6 is not on this image; falling back to the newest installed."
            ls -d /Applications/Xcode*.app || true
            wanted=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          fi
          echo "Selecting $wanted"
          sudo xcode-select -s "$wanted"
          xcodebuild -version

      # maui-ios, not maui: the full workload would pull in the Android SDK
      # and MacCatalyst for a job that builds neither.
      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      # appsettings.json is git-ignored, so a checkout never has one, and
      # until now neither did any artifact CI produced. That was correct for
      # a build nobody installed and wrong the moment these artifacts became
      # something to put on a phone: the app came up with no idea which
      # intergroup it belonged to, and every call that needed a server URL
      # failed after sign-in rather than before it.
      #
      # Written from a repository *variable*, not a secret. The test bed's
      # address is public and appears in this repo's README; pretending
      # otherwise would buy nothing and make it harder to change. What the
      # variable buys is that the file still never enters git -- which is the
      # actual rule, because appsettings.json is where a credential naturally
      # gets typed and Hand published a Better Stack token exactly that way.
      #
      # Only BaseUrl is written. CallbackUrl defaults to link://auth in
      # FellowshipConfiguration and PollSeconds to 120, so naming them here
      # would add a fifth place for the callback scheme to disagree with
      # itself -- see README.md, "The four places link://auth is written".
      #
      # Unset is not a failure. A fork, or this repo before the variable
      # existed, builds exactly as it did before and produces an artifact
      # whose sign-in screen says the app has not been set up.
      - name: Write appsettings.json
        env:
          BASE_URL: ${{ vars.LINK_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL:-}" ]; then
            echo 'LINK_BASE_URL is not set; building unconfigured.'
            echo 'The artifact will run, and its sign-in screen will say so.'
            exit 0
          fi
          case "$BASE_URL" in
            https://*) ;;
            *) echo "LINK_BASE_URL must start with https:// -- got '$BASE_URL'" >&2; exit 1 ;;
          esac
          case "$BASE_URL" in
            *'"'*|*'\'*) echo 'LINK_BASE_URL must not contain quotes or backslashes.' >&2; exit 1 ;;
          esac
          printf '{\n  "Fellowship": {\n    "BaseUrl": "%s"\n  }\n}\n' "$BASE_URL" \
            > TheBleedingDeacons.Intergroup.Link/appsettings.json
          echo 'Wrote:'
          cat TheBleedingDeacons.Intergroup.Link/appsettings.json

      # Release for a device (ios-arm64), unsigned.
      #
      # LinkIosOnly narrows TargetFrameworks to the iOS head. Do NOT reach
      # for -f net10.0-ios instead: that sets TargetFramework as a global
      # property and forces it onto Link.Core, which is plain net10.0, and
      # its restore fails with NU1105.
      #
      # LinkUnsigned switches off code signing in the csproj. The device RID
      # rather than a simulator one is deliberate — a simulator build needs
      # no signing at all and would be an easier green, but it produces a
      # .app for an architecture no phone runs, and calling that an iOS
      # artifact would be a lie the badge could not tell apart.
      - name: Build the iOS head, unsigned
        run: >
          dotnet build TheBleedingDeacons.Intergroup.Link/TheBleedingDeacons.Intergroup.Link.csproj
          -c Release
          -p:LinkIosOnly=true
          -p:LinkUnsigned=true
          -p:RuntimeIdentifier=ios-arm64
          -p:ContinuousIntegrationBuild=true

      # An .ipa is a zip with the .app inside a Payload/ directory, and that
      # is the whole format. Assembled by hand rather than with
      # ArchiveOnBuild=true, which drives Xcode's archive step and wants a
      # signing identity — the one thing this job does not have.
      #
      # -y keeps symlinks as symlinks. A framework bundle is full of them,
      # and following them produces an archive that is larger and, on iOS,
      # wrong.
      - name: Assemble the .ipa
        run: |
          set -euo pipefail
          app=$(find TheBleedingDeacons.Intergroup.Link/bin/Release/net10.0-ios                 -maxdepth 3 -type d -name '*.app' | head -1)
          if [ -z "$app" ]; then
            echo 'No .app was produced; nothing to archive.' >&2
            exit 1
          fi
          echo "Archiving $app"
          mkdir -p archive/Payload
          cp -R "$app" archive/Payload/
          (cd archive && zip -qry ../link-unsigned.ipa Payload)
          ls -la link-unsigned.ipa

      - name: Upload the .ipa
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: link-ipa-unsigned
          path: link-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  test:
    name: Test & coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore local tools (coverlet.console)
        run: dotnet tool restore

      # No MAUI workload and no JDK: Link.Core and its test project are plain
      # net10.0. Building the test project pulls Link.Core in with it.
      - name: Build tests
        run: >
          dotnet build TheBleedingDeacons.Intergroup.Link.Tests/TheBleedingDeacons.Intergroup.Link.Tests.csproj
          -c Debug

      # xUnit v3 runs on Microsoft.Testing.Platform, so the test project is an
      # executable. coverlet.console instruments Link.Core and runs that test
      # host, producing a Cobertura report. (coverlet's collector / msbuild
      # integrations hook VSTest, which MTP does not use — hence the tool.)
      #
      # --include narrows the report to Link.Core: the test assembly and the
      # NuGet dependencies are not what this number is about. The app project
      # is not in it either, because nothing can reference it — that is what
      # the split is for, and what the README says the badge covers.
      #
      # --exclude-by-attribute Obsolete leaves deprecated code out of the
      # figure. Writing tests for something already marked for removal would
      # move the number without improving anything, and leaving it in would
      # penalise the deprecation instead of the debt.
      - name: Test with coverage
        run: >
          dotnet coverlet TheBleedingDeacons.Intergroup.Link.Tests/bin/Debug/net10.0/TheBleedingDeacons.Intergroup.Link.Tests.dll
          --target dotnet
          --targetargs "TheBleedingDeacons.Intergroup.Link.Tests/bin/Debug/net10.0/TheBleedingDeacons.Intergroup.Link.Tests.dll"
          --format cobertura
          --output coverage/coverage.cobertura.xml
          --include "[TheBleedingDeacons.Intergroup.Link.Core]*"
          --exclude-by-attribute Obsolete

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          # Public repo: the built-in GITHUB_TOKEN authenticates the upload,
          # so no separate Coveralls token/secret is required.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/coverage.cobertura.xml
          format: cobertura
          fail-on-error: false

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest

    # A job of its own, rather than a step inside the build as the PHP plugins
    # do it. There the scan is a step because it has to fail before
    # `composer install`; here the surrounding jobs install a JDK, the .NET SDK
    # and the MAUI Android workload, none of which Semgrep needs. A
    # separate job runs in parallel and reports on its own terms.
    #
    # `semgrep ci` is diff-aware on a pull request, so it fails only on what
    # that PR introduces. Which findings are fatal is decided by the Block
    # remediation policy in Semgrep - currently Critical or High severity Code
    # findings - not by anything in this file.
    #
    # The version job below has this job in its `needs:`, so a red Semgrep on
    # main stops a version being cut, the same way `release: needs: ci` works
    # in the PHP plugin suite.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Semgrep
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          if [ -z "${SEMGREP_APP_TOKEN:-}" ]; then
            echo 'SEMGREP_APP_TOKEN is not set - skipping the scan.'
            echo 'Set it as an organisation secret to enable this gate.'
            exit 0
          fi
          python3 -m pip install --quiet semgrep==1.174.0
          semgrep ci

  version:
    name: Bump version & publish the release
    # The whole point of this change: the bump now waits on every gate. Before,
    # this lived in its own workflow triggered by `push` with no `needs:` at
    # all, so a version was cut whether or not the build, the tests or Semgrep
    # had passed. `needs:` makes a version something only green code gets.
    #
    # `ios` is in here on purpose, and it is the one entry worth arguing
    # about: a broken iOS head now stops an Android release. That is the
    # right way round while the two heads share every line of code above the
    # platform folders — a compile error in Link.Core would break both, and
    # releasing Android from a tree that does not build is how the iOS head
    # would quietly rot back to the state this change took it out of. Drop it
    # from this list the day the iOS head has its own version.
    needs: [build, ios, test, semgrep]

    # main only, and only for a real push - not for pull_request runs of this
    # same workflow, and not for workflow_dispatch.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    runs-on: ubuntu-latest

    # The workflow default is contents: read; pushing the version commit needs
    # write, asked for here so nothing else in this file gets it.
    permissions:
      contents: write

    # Serialise. Two merges landing close together must not race to compute the
    # same next version. Deliberately not cancel-in-progress: a cancelled run
    # would drop a bump entirely.
    concurrency:
      group: version-main
      cancel-in-progress: false

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the bump is derived by walking the commits this push
          # brought in.
          fetch-depth: 0

      - name: Compute and apply the bump
        id: bump
        # Invoked through bash rather than directly: this repo is authored on
        # Windows, where git frequently does not record the executable bit, and
        # a missing +x would fail the run for a reason nothing in the diff shows.
        #
        # github.event.before is the tip main had before this push. It is
        # all-zeros on a branch's first push, and can point at a commit this
        # clone does not have after a force-push, so fall back to HEAD~1.
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            echo "No usable github.event.before; falling back to HEAD~1."
            before="HEAD~1"
          fi
          bash .github/scripts/bump-version.sh "${before}..HEAD"

      - name: Commit the new version
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # [skip ci] so this push does not re-run the build jobs against a
          # commit whose only change is a version string. The script also
          # refuses to bump when HEAD is already a version commit, so the loop
          # is closed twice over — belt and braces, because a runaway here
          # would bump on every iteration.
          git commit -am "chore: version ${{ steps.bump.outputs.version }} [skip ci]"

          # Rebase onto anything that landed while this job was running, and
          # retry. A bare `git push` here fails outright when main has moved
          # between the checkout above and this line, and that is not
          # hypothetical: it happened on 2026-09-05, when a merge landed
          # sixteen seconds before this push and took the whole release with
          # it. Every gate had passed; the version was simply lost, and the
          # next release skipped a number to catch up.
          #
          # The concurrency group above serialises this job against *itself*,
          # so the race is never two version jobs — it is a person merging
          # while one is in flight, which no amount of job-level concurrency
          # can prevent.
          #
          # Rebasing is safe for the version this job computed. The bump was
          # derived from the commit range this run was triggered for, and the
          # commits that arrived meanwhile are not in that range — they get
          # their own run and their own bump, so nothing is skipped or
          # double-counted by landing this commit on top of them.
          #
          # A conflict is not retried. The only way to conflict here is
          # another writer touching the same version line, which the
          # concurrency group already rules out for this job — so it means
          # something genuinely unexpected, and failing loudly beats
          # resolving it blind.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed the version commit on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt; main moved. Rebasing onto it."
            if ! git pull --rebase origin main; then
              echo "Rebase onto main failed; leaving it alone." >&2
              git rebase --abort || true
              exit 1
            fi
          done
          echo "Could not push the version commit after 3 attempts." >&2
          exit 1

      # The tag is not decoration: it is how bump-version.sh knows whether
      # anything has shipped, which is what lets the first release keep the
      # version in the csproj instead of bumping past it. Written after the
      # commit so it points at the version it names.
      #
      # Guarded against existing, so a re-run of a green release is a no-op
      # rather than a failure.
      - name: Tag the release
        if: steps.bump.outputs.version != ''
        run: |
          tag="v${{ steps.bump.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to tag."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"

      # ---------------------------------------------------------------
      # Publish a GitHub Release, with an APK built at the version it names.
      #
      # Until now this job tagged and stopped. A tag is enough for
      # bump-version.sh to do its arithmetic, but it is not something anyone
      # can download: every build this repo has ever produced lived in a
      # workflow artifact that expires after 30 days, so a version older than
      # a month had nothing to show for itself at all. Hand is in the same
      # state — this is new for both apps rather than Link catching up.
      #
      # THE REBUILD IS THE POINT, and it is why this is not a
      # download-artifact from the build job. That artifact was built from
      # the commit *before* the bump, so its manifest carries the previous
      # version; attaching it to a tag naming the new one would ship an APK
      # that disagrees with its own release. That is precisely the drift the
      # AssemblyVersion change removed from the csproj, reintroduced one
      # level up. Fellowship's release job pays the same cost for the same
      # reason — it re-runs its production build after writing the version
      # rather than reusing anything earlier in the run.
      #
      # Android only. The .ipa is built on macOS and this job is ubuntu, and
      # plumbing it across would buy nothing: it is unsigned, so it installs
      # on precisely nothing until somebody with an Apple Developer Program
      # certificate re-signs it.
      - name: Setup JDK 21
        if: steps.bump.outputs.version != ''
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup .NET
        if: steps.bump.outputs.version != ''
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install MAUI Android workload
        if: steps.bump.outputs.version != ''
        run: dotnet workload install maui-android

      # Same file, same rules, and the same silence when unset as the build
      # job — see the long comment there for why this is a variable and not a
      # secret. Repeated rather than shared: a composite action for four
      # lines would hide the one thing worth reading.
      - name: Write appsettings.json
        if: steps.bump.outputs.version != ''
        env:
          BASE_URL: ${{ vars.LINK_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL:-}" ]; then
            echo 'LINK_BASE_URL is not set; releasing an unconfigured build.'
            echo 'It will run, and its sign-in screen will say it is not set up.'
            exit 0
          fi
          case "$BASE_URL" in
            https://*) ;;
            *) echo "LINK_BASE_URL must start with https:// -- got '$BASE_URL'" >&2; exit 1 ;;
          esac
          case "$BASE_URL" in
            *'"'*|*'\'*) echo 'LINK_BASE_URL must not contain quotes or backslashes.' >&2; exit 1 ;;
          esac
          printf '{\n  "Fellowship": {\n    "BaseUrl": "%s"\n  }\n}\n' "$BASE_URL" \
            > TheBleedingDeacons.Intergroup.Link/appsettings.json

      # Builds the working tree, which by this point carries the bumped
      # csproj written by the commit step above.
      - name: Build the release APK
        if: steps.bump.outputs.version != ''
        run: >
          dotnet build TheBleedingDeacons.Intergroup.Link/TheBleedingDeacons.Intergroup.Link.csproj
          -c Release
          -p:LinkAndroidOnly=true
          -p:ContinuousIntegrationBuild=true

      # -Signed.apk is the one to keep: .NET Android emits an unsigned
      # intermediate alongside it. Renamed for the version so a downloaded
      # file still says what it is once it is sitting in somebody's downloads
      # folder next to four others.
      - name: Name the APK for its version
        id: apk
        if: steps.bump.outputs.version != ''
        run: |
          set -euo pipefail
          src=$(ls TheBleedingDeacons.Intergroup.Link/bin/Release/net10.0-android/*-Signed.apk 2>/dev/null | head -1)
          if [ -z "$src" ]; then
            echo 'No -Signed.apk was produced. bin/Release/net10.0-android holds:' >&2
            ls -l TheBleedingDeacons.Intergroup.Link/bin/Release/net10.0-android || true
            exit 1
          fi
          out="link-${{ steps.bump.outputs.version }}.apk"
          cp "$src" "$out"
          echo "apk=$out" >> "$GITHUB_OUTPUT"
          ls -l "$out"

      # The body is not decoration. This APK is signed with the runner's
      # throwaway debug keystore, and somebody will eventually find this page
      # without having read a line of ci.yml — at which point the difference
      # between "a build you can try" and "a build that costs you every
      # message on that handset" needs to be on the page they are looking at.
      - name: Write the release notes
        if: steps.bump.outputs.version != ''
        run: |
          cat > release-notes.md <<'EOF'
          ### What this APK is

          A **Debug-keystore-signed** Android build, produced on a GitHub runner
          from the commit this tag names. It is a compile gate and a
          convenience — not a shipping artifact.

          ### Before you install it

          It is signed with the runner's own throwaway key, which is not the key
          on any developer machine. If you already have a locally built Link on
          the handset, it will refuse to install over it with
          `INSTALL_FAILED_UPDATE_INCOMPATIBLE`.

          **Do not uninstall to get past that.** Link's device token and its RSA
          private key live in `SecureStorage`, and Fellowship holds only the
          public half — so uninstalling makes every message already sealed to
          that handset permanently unreadable, by everyone, with no way back.
          The encrypted local history goes with it. Build locally instead.

          ### iOS

          Not attached. The `.ipa` this workflow archives is unsigned and
          installs on nothing until it is re-signed with an Apple Developer
          Program certificate.
          EOF

      # Guarded against existing so a re-run of a green release is a no-op
      # rather than a failure, matching the tag step above.
      - name: Publish the GitHub Release
        if: steps.bump.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v${{ steps.bump.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released; nothing to publish."
            exit 0
          fi
          gh release create "$tag" \
            "${{ steps.apk.outputs.apk }}" \
            --title "$tag" \
            --notes-file release-notes.md \
            --generate-notes

      - name: Summary
        run: |
          if [ "${{ steps.bump.outputs.first }}" = "true" ]; then
            echo "### Version ${{ steps.bump.outputs.version }} (first release)" >> "$GITHUB_STEP_SUMMARY"
            echo "Adopted from the csproj rather than bumped; tagged v${{ steps.bump.outputs.version }}." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.bump.outputs.changed }}" = "true" ]; then
            echo "### Version ${{ steps.bump.outputs.version }} (${{ steps.bump.outputs.bump }} bump)" >> "$GITHUB_STEP_SUMMARY"
            echo "Android versionCode ${{ steps.bump.outputs.code }}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Version unchanged" >> "$GITHUB_STEP_SUMMARY"
            echo "Nothing to version in this push." >> "$GITHUB_STEP_SUMMARY"
          fi
